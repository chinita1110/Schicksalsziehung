<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Die Büro-Schicksalsziehung</title>
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:linear-gradient(145deg,#111827,#312e81 55%,#111827);font-family:Arial,Helvetica,sans-serif;color:#fff;display:flex;align-items:center;justify-content:center;padding:18px}
.card{width:min(680px,100%);text-align:center;background:rgba(17,24,39,.92);border:1px solid rgba(255,255,255,.15);border-radius:30px;padding:30px 22px 26px;box-shadow:0 25px 80px rgba(0,0,0,.45)}
.small{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:#c4b5fd;font-weight:800}
h1{font-size:clamp(32px,8vw,58px);margin:10px 0 4px}
.subtitle{color:#cbd5e1;margin:0 auto 24px}
.number{height:190px;display:flex;align-items:center;justify-content:center;font-size:clamp(95px,25vw,175px);font-weight:900;line-height:1;text-shadow:0 8px 30px rgba(0,0,0,.35)}
.result{min-height:92px;font-size:clamp(21px,5vw,32px);font-weight:900;line-height:1.18;display:flex;align-items:center;justify-content:center}
button{margin-top:18px;background:#fbbf24;border:0;border-radius:16px;padding:17px 28px;font-size:18px;font-weight:900;cursor:pointer;color:#111827;box-shadow:0 8px 25px rgba(251,191,36,.25)}
button:disabled{opacity:.55;cursor:wait}
.warning{margin-top:18px;color:#94a3b8;font-size:13px}
.footer{margin-top:25px;padding-top:17px;border-top:1px solid rgba(255,255,255,.1);color:#64748b;font-size:11px}
</style>
</head>
<body>
<main class="card">
  <div class="small">Offizielle Büro-Schicksalsziehung</div>
  <h1>🎲 Deine Nummer</h1>
  <p class="subtitle">Scanne. Ziehe. Akzeptiere dein Schicksal.</p>

  <div id="number" class="number">?</div>
  <div id="result" class="result">Bereit für dein Büro-Schicksal?</div>

  <button id="draw">NUMMER ZIEHEN</button>
  <div class="warning">⚠️ Deine Nummer steht fest. Nicht schummeln und nochmal ziehen!</div>
  <div class="footer">Die Ziehung erfolgt zufällig. Vier Kategorien – jeweils 25 %.</div>
</main>

<script>
const categories=[
 {weight:25,messages:[
  "Maximaler Einsatz, minimaler Nutzen.",
  "Agent 007: 0 Leistung, 0 Bock, 7 Raucherpausen.",
  "Herzlichen Glückwunsch. Du hast exakt nichts gewonnen.",
  "Heute leider nur moralischer Beistand.",
  "Du hast gewonnen – die Erfahrung einer Niete."
 ]},
 {weight:25,messages:[
  "Nur nicht hetzen, schnapp dir ein Bonbon und komm später nochmal."
 ]},
 {weight:25,messages:[
  "Gewinner! Du darfst 10 Minuten früher Feierabend machen.",
  "Gewinner! Du hast Anspruch auf einen Snack!",
  "Gewinner! Heute geht der nächste Kaffee auf die Kollegschaft.",
  "Gewinner! Du hast dir eine 10-minütige Büro-Auszeit verdient.",
  "Gewinner! Du darfst einmal eine Aufgabe an jemanden delegieren."
 ]},
 {weight:25,messages:[
  "Du hast Glück! Du darfst vortreten."
 ]}
];

const numberEl=document.getElementById("number");
const resultEl=document.getElementById("result");
const button=document.getElementById("draw");

function randomNumber(){return Math.floor(Math.random()*100)+1}
function pickCategory(){
  const r=Math.random()*100;
  let sum=0;
  for(const c of categories){sum+=c.weight;if(r<sum)return c}
  return categories[3];
}
function draw(){
  button.disabled=true;
  resultEl.textContent="DIE ZIEHUNG LÄUFT …";
  let ticks=0;
  const timer=setInterval(()=>{
    numberEl.textContent=randomNumber();
    ticks++;
    if(ticks>=24){
      clearInterval(timer);
      const c=pickCategory();
      numberEl.textContent=randomNumber();
      resultEl.textContent=c.messages[Math.floor(Math.random()*c.messages.length)];
      button.textContent="NOCHMAL ZIEHEN";
      button.disabled=false;
    }
  },65);
}
button.addEventListener("click",draw);
</script>
</body>
</html>
